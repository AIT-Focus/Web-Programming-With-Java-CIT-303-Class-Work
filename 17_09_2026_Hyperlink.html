<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperLink</title>
</head>
<body>
    <!-- Creating Link -->
    <!-- <a> (anchor tag is used) -->
    <h2>Links To Social Media Sites Using Text</h2>
    <a href="https://www.google.com/">
        Google
    </a>
    <br>
    <a href="https://www.facebook.com/">
        Facebook
    </a>

    <h2>Links To Social Media Sites Using Images</h2>
    <a href="https://www.google.com/">
        <img src="images/google.jpg" alt="Not Found" width="100" height="100"/>
    </a>
    <br>
    <a href="https://www.facebook.com/">
        <img src="images/fb.jpg" alt="Not Found" width="100" height="100"/>
    </a>
    
    <h2>Use Of Target Attribute</h2>
    <a href="https://www.google.com/" target="_blank">
        Google
    </a>
</body>
</html>
