<!DOCTYPE html>
<html>
 <head>
 <title> Tables Show</title>
 </head>
 <body>
 <h1 align="center">Colspan and rowspan</h1>
<h3 align="center">Cell that spans two
columns:</h3>
<table border="1" align="center">
 <tr>
 <th>Name</th>
 <th>Email</th>
 <th colspan="2">Phone #</th>
 </tr>
 <tr>
 <td>Muhammad Ali</td>
 <td>mali@gmail.com</td>
 <td>0313-2148720</td>
 <td>0333-2346770</td>
 </tr>
</table>
<h3 align="center">Cell that spans two
rows:</h3>
<table border="1" align="center">
 <tr>
 <th>Name:</th>
 <td>Muhammad Ali</td>
 </tr>
 <tr>
 <th>Email:</th>
 <td>mali@gmail.com</td>
 </tr>
 <tr>
 <th rowspan="2">Phone#:</th>
 <td>0313-2148720</td>
 </tr>
 <tr>
 <td>0333-2387232</td>
 </tr>
</table
 </body>
</html>
