<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity</title>
    <style type="text/css">
        h1{
            text-align: center;
            text-decoration: overline;
        }
        h1:hover{
            text-decoration: underline;
            text-shadow: 2px 2px 4px brown;
            text-decoration-color: brown;
        }
        img{
            width: 200px;
            height: 200px;
            opacity: 0.6;
        }
        img:hover{
            opacity: 1.0;
        }
    </style>
</head>
<body>
    <h1>Image Gallery</h1>
    <hr>
    <img src="images/image01.jpg" alt="No Image Found" border="1"/>
    <img src="images/image02.jpg" alt="No Image Found" border="1"/>
    <img src="images/image03.jpg" alt="No Image Found" border="1"/>
    <img src="images/image04.jpg" alt="No Image Found" border="1"/>
    <img src="images/image05.jpg" alt="No Image Found" border="1"/>
    <img src="images/image06.jpg" alt="No Image Found" border="1"/>
    <img src="images/image07.jpg" alt="No Image Found" border="1"/>
    <img src="images/image07.jpg" alt="No Image Found" border="1"/>
</body>
</html>
