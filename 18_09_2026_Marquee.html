<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee</title>
</head>
<body>
    <h2>Marquee Tag</h2>
    <hr>
    <marquee behavior="scroll" direction="right">
        This is a sliding animation...
    </marquee>
    <hr>
    <marquee bgcolor="yellow" behavior="alternate" direction="left" scrollamount="1">
        This is a sliding animation...
    </marquee>
    <hr>
    
    <br><br><br>
    <h2>Marquee With Images</h2>
    <marquee behavior="scroll" direction="right" bgcolor="black">

        <img src="images/image01.jpg" alt="Not Found" width="300" height="200" border="2" hspace="5"/>

        <img src="images/image02.jpg" alt="Not Found" width="300" height="200" border="2" hspace="5"/>

        <img src="images/image03.jpg" alt="Not Found" width="300" height="200" border="2" hspace="5"/>

        <img src="images/image04.jpg" alt="Not Found" width="300" height="200" border="2" hspace="5"/>

        <img src="images/image05.jpg" alt="Not Found" width="300" height="200" border="2" hspace="5"/>

        <img src="images/image06.jpg" alt="Not Found" width="300" height="200" border="2" hspace="5"/>

        <img src="images/image07.jpg" alt="Not Found" width="300" height="200" border="2" hspace="5"/>
        
    </marquee>

</body>
</html>
